---
services:
  webhook-server:
    build:
      context: ./webhook-server
      #tags:
      #  - "dan-perron/webhook-server"
    container_name: webhook-server
    image: "dan-perron/webhook-server"
    environment:
      - MONGODB_CONNSTRING=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb/?authSource=admin
    ports:
      - 3000:3000
    restart: unless-stopped
    volumes:
      - thunderdome-ootp:/ootp
  calcium-tracker:
    build:
      context: ./calcium-tracker
    container_name: calcium-tracker
    image: "dan-perron/calcium-tracker"
    environment:
      - MONGODB_CONNSTRING=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb/?authSource=admin
      - BASE_PATH=${CALCIUM_BASE_PATH:-/calcium}
      - CALCIUM_PASSWORD=${CALCIUM_PASSWORD:-}
      - CALCIUM_COOKIE_SECRET=${CALCIUM_COOKIE_SECRET:-change-me}
    ports:
      - 3001:3001
    restart: unless-stopped
  meeting-scheduler:
    build:
      context: ./meeting-scheduler
    container_name: meeting-scheduler
    image: "dan-perron/meeting-scheduler"
    environment:
      - MONGODB_CONNSTRING=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb/?authSource=admin
      - MONGODB_DATABASE=${MEET_DATABASE:-scheduler}
      - BASE_PATH=${MEET_BASE_PATH:-/meet}
      - PORT=3002
      # Set false only to test over plain http (e.g. http://signs:3002/meet);
      # with Secure cookies the browser silently drops the session on http.
      - COOKIE_SECURE=${MEET_COOKIE_SECURE:-true}
      # Absolute origin, used to build shareable event links. Needed because the
      # Apache vhost does not set ProxyPreserveHost.
      - PUBLIC_ORIGIN=${MEET_PUBLIC_ORIGIN:-https://djperron.com}
    ports:
      - 3002:3002
    restart: unless-stopped
  bet-tracker:
    build:
      context: ./bet-tracker
    container_name: bet-tracker
    image: "dan-perron/bet-tracker"
    environment:
      - APP_TOKEN=${BET_APP_TOKEN}
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - BASE_PATH=${BET_BASE_PATH:-/bets}
      - PUBLIC_ORIGIN=${BET_PUBLIC_ORIGIN:-https://djperron.com}
      - PREGAME_SNAPSHOT=${BET_PREGAME_SNAPSHOT:-true}
      - NTFY_URL=${SCORES_NTFY_URL:-}
      - NTFY_TOKEN=${SCORES_NTFY_TOKEN:-}
      - SCORES_QUIET_HOURS=${SCORES_QUIET_HOURS:-}
      - TZ=America/Chicago
    ports:
      - 3003:3003
    restart: unless-stopped
    volumes:
      - bet-tracker-data:/data
  mongodb:
    image: mongo:6.0
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    restart: unless-stopped
  personal-assistant:
    build:
      context: ./personal-assistant
    container_name: personal-assistant
    image: "dan-perron/personal-assistant"
    environment:
      - MONGODB_CONNSTRING=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb/?authSource=admin
      - TZ=America/Chicago
    restart: unless-stopped
  #windows-rdp-automation:
  #  build:
  #    context: ./windows-rdp-automation
  #  container_name: windows-rdp-automation
  #  image: "dan-perron/windows-rdp-automation"
  #  restart: unless-stopped
volumes:
  mongodb-data:
  bet-tracker-data:
  thunderdome-ootp:
    name: thunderdome-ootp
    external: true
