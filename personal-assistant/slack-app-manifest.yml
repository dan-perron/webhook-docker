display_information:
  name: Personal Assistant
  description: Personal productivity bot — exercise reminders and more
  background_color: '#2c2d30'

features:
  bot_user:
    display_name: personal-assistant
    always_online: true
  slash_commands:
    - command: /assistant
      description: Personal assistant commands
      usage_hint: 'exercises upload'
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - im:history

settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
