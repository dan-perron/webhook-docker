<script type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@id":"urn:nyt:ScoopRecipe:5758f710d3395499922b1867f905436a","@type":"Recipe","aggregateRating":{"@type":"AggregateRating","ratingCount":12940,"ratingValue":4},"author":{"@id":"nyt://person/1dbc665c-9203-5842-87a0-1ff7e3c681c8","@type":"Person","description":"Sam Sifton, the host of The Morning, was previously an assistant managing editor responsible for culture and lifestyle coverage and is the founding editor of New York Times Cooking.","image":[{"@id":"nyt://image/a9f31f13-598e-5b91-a2e5-51b8d0fb891c#superJumbo","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2018/06/21/multimedia/author-sam-sifton/author-sam-sifton-superJumbo-v3.png","dateModified":"2025-10-27T14:47:21.209Z","datePublished":"2018-06-21T19:24:34.000Z","height":"1000","uploadDate":"2018-06-21T19:24:34.000Z","url":"https://static01.nyt.com/images/2018/06/21/multimedia/author-sam-sifton/author-sam-sifton-superJumbo-v3.png","width":"1000"},{"@id":"nyt://image/a9f31f13-598e-5b91-a2e5-51b8d0fb891c#mediumSquareAt3X","@type":"ImageObject","contentUrl":"https://static01.nyt.com/images/2018/06/21/multimedia/author-sam-sifton/author-sam-sifton-mediumSquareAt3X-v2.png","dateModified":"2025-10-27T14:47:21.209Z","datePublished":"2018-06-21T19:24:34.000Z","height":"1000","uploadDate":"2018-06-21T19:24:34.000Z","url":"https://static01.nyt.com/images/2018/06/21/multimedia/author-sam-sifton/author-sam-sifton-mediumSquareAt3X-v2.png","width":"1000"}],"name":"Sam Sifton","sameAs":["https://www.nytimes.com/by/sam-sifton","https://x.com/samsifton","https://www.facebook.com/samsifton.58"],"url":"https://cooking.nytimes.com/author/sam-sifton"},"copyrightHolder":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"copyrightYear":2016,"dateModified":"2023-06-14T00:00:00Z","datePublished":"2016-01-27T00:00:00Z","description":"An Internet darling of a pot roast recipe, a favorite of mom bloggers and Pinterest, Mississippi Roast is traditionally made by placing a chuck roast in a slow cooker and simmering it beneath a stick of butter, a package of ranch dressing mix, another of “au jus” gravy mix and a handful of pepperoncini. And you can certainly cook it that way. The raves are justified. But replacing the packaged mixes is no real chore, and it results in a luscious tangle of deliciously tangy beef that goes beautifully with mashed or roasted potatoes or egg noodles, or as a hot-sandwich filling. Cooking time will vary depending on the size of your roast and the effectiveness of your slow cooker. But six to eight hours generally does the trick. (If you're in the market for a slow-cooker, our colleagues at The Wirecutter have spent a great deal of time testing them. Check out their guide to the best on the market.) Sam Sifton","image":[{"@id":"nyt://image/7c2a5eda-67c1-517d-9d5c-198d38fdfa7b#videoSixteenByNineJumbo1600","@type":"ImageObject","caption":"Robin Chapman’s Mississippi Roast, adapted by Sam Sifton.","contentUrl":"https://static01.nyt.com/images/2020/08/30/dining/27ROAST1/27ROAST1-videoSixteenByNineJumbo1600-v2.jpg","creditText":"Melina Hammer for The New York Times","dateModified":"2024-10-04T16:11:02.269Z","datePublished":"2016-01-23T02:40:36.000Z","height":"901","uploadDate":"2016-01-23T02:40:36.000Z","url":"https://static01.nyt.com/images/2020/08/30/dining/27ROAST1/27ROAST1-videoSixteenByNineJumbo1600-v2.jpg","width":"1600"},{"@id":"nyt://image/7c2a5eda-67c1-517d-9d5c-198d38fdfa7b#googleFourByThree","@type":"ImageObject","caption":"Robin Chapman’s Mississippi Roast, adapted by Sam Sifton.","contentUrl":"https://static01.nyt.com/images/2020/08/30/dining/27ROAST1/27ROAST1-googleFourByThree-v2.jpg","creditText":"Melina Hammer for The New York Times","dateModified":"2024-10-04T16:11:02.269Z","datePublished":"2016-01-23T02:40:36.000Z","height":"600","uploadDate":"2016-01-23T02:40:36.000Z","url":"https://static01.nyt.com/images/2020/08/30/dining/27ROAST1/27ROAST1-googleFourByThree-v2.jpg","width":"800"},{"@id":"nyt://image/7c2a5eda-67c1-517d-9d5c-198d38fdfa7b#facebookJumbo","@type":"ImageObject","caption":"Robin Chapman’s Mississippi Roast, adapted by Sam Sifton.","contentUrl":"https://static01.nyt.com/images/2020/08/30/dining/27ROAST1/27ROAST1-facebookJumbo-v2.jpg","creditText":"Melina Hammer for The New York Times","dateModified":"2024-10-04T16:11:02.269Z","datePublished":"2016-01-23T02:40:36.000Z","height":"550","uploadDate":"2016-01-23T02:40:36.000Z","url":"https://static01.nyt.com/images/2020/08/30/dining/27ROAST1/27ROAST1-facebookJumbo-v2.jpg","width":"1050"}],"isAccessibleForFree":false,"keywords":"Chuck Roast, Pepperoncini, Slow Cooker","mainEntityOfPage":{"@id":"//cooking.nytimes.com/recipes/1017937-mississippi-roast","@type":"WebPage","name":"Mississippi Roast"},"name":"Mississippi Roast","nutrition":{"@type":"NutritionInformation","calories":"589.625","carbohydrateContent":"3.9 grams","cholesterolContent":"186.6 milligrams","fatContent":"41.5 grams","fiberContent":"0.5 grams","proteinContent":"47.6 grams","saturatedFatContent":"15.2 grams","sodiumContent":"607.9 milligrams","sugarContent":"0.1 grams","unsaturatedFatContent":"4.5 grams"},"publisher":{"@id":"https://cooking.nytimes.com/#publisher","@type":"Organization","name":"NYT Cooking"},"recipeCategory":"Dinner, Kid-Friendly, Main Course, Roasts","recipeCuisine":"American","recipeIngredient":["1 boneless chuck roast or top or bottom round roast, 3 to 4 pounds","2 teaspoons kosher salt, plus more to taste","1 ½ teaspoons freshly ground black pepper, plus more to taste","¼ cup all-purpose flour","3 tablespoons neutral oil, like canola","4 tablespoons unsalted butter","8 to 12 pepperoncini","2 tablespoons mayonnaise","2 teaspoons apple cider vinegar","½ teaspoon dried dill","¼ teaspoon sweet paprika","1 teaspoon buttermilk, optional","Chopped parsley, for garnish"],"recipeInstructions":[{"@type":"HowToStep","text":"Place roast on a cutting board and rub the salt and pepper all over it. Sprinkle the flour all over the seasoned meat and massage it into the flesh.","url":"https://cooking.nytimes.com/recipes/1017937-mississippi-roast#recipe-step-1"},{"@type":"HowToStep","text":"Heat the oil in a large sauté pan set over high heat until it is shimmering and about to smoke. Place the roast in the pan and brown on all sides, 4 to 5 minutes a side, to create a crust. Remove roast from pan and place it in the bowl of a slow cooker. Add the butter and the pepperoncini to the meat. Put the lid on the slow cooker, and set the machine to low.","url":"https://cooking.nytimes.com/recipes/1017937-mississippi-roast#recipe-step-2"},{"@type":"HowToStep","text":"As the roast heats, make a ranch dressing. Combine the mayonnaise, vinegar, dill and paprika in a small bowl and whisk to emulsify. Add the buttermilk if using, then whisk again. Remove the lid from the slow cooker and add the dressing. Replace the top and allow to continue cooking, undisturbed, for 6 to 8 hours, or until you can shred the meat easily using 2 forks. Mix the meat with the gravy surrounding it. Garnish with parsley, and serve with egg noodles or roast potatoes, or pile on sandwich rolls, however you like.","url":"https://cooking.nytimes.com/recipes/1017937-mississippi-roast#recipe-step-3"}],"recipeYield":"6 to 8 servings","review":[{"@type":"Review","author":{"@type":"Person","name":"Kayla"},"datePublished":"2026-10-20T10:00:09Z","reviewBody":"Divine! No notes from me!"},{"@type":"Review","author":{"@type":"Person","name":"Jon L"},"datePublished":"2026-10-05T02:02:10Z","reviewBody":"Didnt have unsalted butter so halved it with ghee. Daughter doesnt like spice so put a little apple cider vinegar in instead of peperoncini, and just ate uncooked peperoncini on the side, (which I definitely recommend). Also had good “artisan” ranch anyways so just put a spoonful in. Very rich, very delicious! Definitely will make again."},{"@type":"Review","author":{"@type":"Person","name":"Sarah in Florida"},"datePublished":"2026-09-14T01:33:43Z","reviewBody":"This recipe is amazing good. I've made it several times. My husband and I both love it and make it as a special \"treat\" a couple times a year. No changes made to the recipe. We use chuck roast and are generous with the peppers. Made it with bottom round once, and it was not as tender (not surprising). I usually serve it with mashed potatoes (using some of the leftover buttermilk) and a hearty green veggie, like roasted Brussels sprouts, asparagus or similar."},{"@type":"Review","author":{"@type":"Person","name":"Peggy"},"datePublished":"2026-09-08T22:32:00Z","reviewBody":"I triple the sauce so that I can freeze it with leftovers. This is one of those dishes that's better the second and third time around."},{"@type":"Review","author":{"@type":"Person","name":"Molly"},"datePublished":"2026-09-27T21:49:19Z","reviewBody":"@Philip C it’s standard for most recipes as the amount of salt in salted butter varies and makes it more difficult to get the seasoning right. If you have a salted butter you want to use instead, it’s fine, but decrease the amount of salt in the recipe and correct carefully."},{"@type":"Review","author":{"@type":"Person","name":"Philip C"},"datePublished":"2026-08-08T22:57:52Z","reviewBody":"Why the specification of \"unsalted\" butter?"},{"@type":"Review","author":{"@type":"Person","name":"Susan"},"datePublished":"2026-07-16T13:22:37Z","reviewBody":"Sour cream can be substituted for buttermilk. Don’t even thin it! Just plop in a spoonful."},{"@type":"Review","author":{"@type":"Person","name":"janine"},"datePublished":"2026-07-15T20:19:22Z","reviewBody":"Brown meat on Saute function, remove and cancel. Use1/2 cup of broth/water to deglaze the pan.  Use wooden spoon to scrape off the delicious brown bits. Finish with 1/2 cup pepperoncini juice.\nReturn roast, add remaining ingredients.  I smeared the ranch dressing right on 3-pound roast. Set the pressure cooker to HIGH for 60 minutes (30 min per pound).  Use a natural release (15-30 min) and release.\nShred meat, return to pot for shocking delicious-ness."},{"@type":"Review","author":{"@type":"Person","name":"Lora"},"datePublished":"2026-04-12T01:53:41Z","reviewBody":"My roast came out SO DRY. It was almost inedible.  What did I do wrong?"},{"@type":"Review","author":{"@type":"Person","name":"Russell"},"datePublished":"2026-03-31T18:45:40Z","reviewBody":"Why not make the ranch dressing at the same time you put the roast in the crock?"},{"@type":"Review","author":{"@type":"Person","name":"Diane"},"datePublished":"2026-03-18T00:47:16Z","reviewBody":"This is delicious. I decided to take the roast out of the pot and shred it on a serving plate. Then I added some sauce over it. I put the remainder of the sauce in a serving bowl for those who wanted more. I felt like this kept the dish from being too greasy which we felt it was when we shredded it into the sauce."},{"@type":"Review","author":{"@type":"Person","name":"Julee Jackson"},"datePublished":"2026-03-02T03:21:47Z","reviewBody":"Needs to cook for 8 hours, very flavorful!  Initially on high.  Had very thick cut beef, thinner, less time."},{"@type":"Review","author":{"@type":"Person","name":"P"},"datePublished":"2026-02-24T03:59:26Z","reviewBody":"I feel like there isn’t enough braising liquid in this recipe. It took like 10 hrs an an Instapot on its slow cooker setting for the meat to become tender."},{"@type":"Review","author":{"@type":"Person","name":"Mike"},"datePublished":"2026-02-16T22:41:07Z","reviewBody":"The original recipe (which I believe the Times published a while back) is still the best.  Chuck roast, envelope of au jus gravy, envelope of ranch dressing, 15 pepperoncinis, 1/2 stick butter.  Done.  8-10 hours on low.  Takes less time to prepare than for me to write this comment.  This isn’t health food, people, stop overthinking it!"},{"@type":"Review","author":{"@type":"Person","name":"Susan Barrow"},"datePublished":"2026-02-16T21:13:56Z","reviewBody":"And the leftovers ( when there are any) are also to die for."},{"@type":"Review","author":{"@type":"Person","name":"netzbang"},"datePublished":"2026-02-16T15:24:05Z","reviewBody":"Nice variation! Just made this recipe yesterday with way less butter, substituted the buttermilk with yogurt, but kept a little Duke’s mayo and it’s still fantastic."},{"@type":"Review","author":{"@type":"Person","name":"Laura B"},"datePublished":"2026-08-22T12:41:18Z","reviewBody":"@Shazziz how did it turn out?"},{"@type":"Review","author":{"@type":"Person","name":"Shazziz"},"datePublished":"2026-02-12T21:28:32Z","reviewBody":"I LOVE cooking this as-is, but it can be too rich/fatty for my husband. Trying it without the butter, mayo, and ranch. Instead, I'm adding some beef broth, Calabrian chilis, pepperoncini, and a little extra vinegar with a splash of Worcestershire. We'll see!"},{"@type":"Review","author":{"@type":"Person","name":"Mimi Pond"},"datePublished":"2016-01-29T12:44:21Z","reviewBody":"I don't understand folks fussing about stirring together a few ingredients to make an impromptu \"ranch dressing.\" Also fussing about the amount of fat. You put 6 T of butter in there. What do you expect? It's all delicious! Dump the whole big jar of pepperoncinis in is my only tweak. Y'all leave my Sammy alone. He works hard to bring you this stuff."},{"@type":"Review","author":{"@type":"Person","name":"Dawn W."},"datePublished":"2016-01-29T23:52:07Z","reviewBody":"Delicious, but Holy Greaseball Batman! Who eats a chuck roast cooked with a stick of butter? Is thatas much fat as the average adult should eat in a year?<br/>The butcher removed the outer fat. I seared the roast in olive oil, with no butter, mayo, etc., added 10 pepperoncini, a cup of white wine, 1.5 cups low sodium beef stock, a handful of fresh thyme branches, 6 peeled garlic cloves, & a slight sprinkle of crushed red pepper flakes. Then cooked it for 6.5 hrs. Incredibly delicious."},{"@type":"Review","author":{"@type":"Person","name":"ralph"},"datePublished":"2016-01-30T20:59:08Z","reviewBody":"My wife made the recipe. She confused Porcini Mushrooms with Pepperoncini. A delicious mistake."},{"@type":"Review","author":{"@type":"Person","name":"Sam Sifton"},"datePublished":"2016-01-27T09:22:11Z","reviewBody":"Yes, of course. Three or four hours at 250 ought to do it, in a covered Dutch oven, maybe longer if your roast is large."},{"@type":"Review","author":{"@type":"Person","name":"Tom B."},"datePublished":"2016-01-25T13:36:08Z","reviewBody":"I know I'll get nowhere with the average NYT reader but the fear of MSG is an old wive's tale and was thoroughly disproven decades ago. <br/><br/>MSG is simply a purified form of glutamate, which is a flavor compound found in everything from mushrooms to anchovies. Adding msg is no different and no more harmful than add adding powdered lemon juice (citric acid) for tanginess, or sugar for sweetness, or salt. Latest science indicates glutamate, far from being harmful, is probably beneficial."},{"@type":"Review","author":{"@type":"Person","name":"Tracy"},"datePublished":"2017-09-26T09:50:19Z","reviewBody":"I'm amazed by all of the anti-fat comments. America has been suckered by low-fat diets and processed low-fat foods for decades and we have rampant diabetes and other diseases. Read the new research! If you just don't care for fat, chill this dish in the fridge or freezer then skim the hardened fat off. How could 4 Tbs of butter distributed through a whole dish with a lot of it left at the bottom of the crockpot be bad for you? Strikes me as paranoia."},{"@type":"Review","author":{"@type":"Person","name":"Maureen"},"datePublished":"2016-01-25T15:53:08Z","reviewBody":"Personally, I am grateful for the alternative to the packaged items, as I have all the ingredients in my pantry already, and I don't usually have packaged salad dressing on hand.  Thank you NY Times, for this option, in spite of all the criticism you're getting for it."},{"@type":"Review","author":{"@type":"Person","name":"Robert Fenerty"},"datePublished":"2016-01-27T21:53:09Z","reviewBody":"A few years ago I sat at the chef's table at a Michelin  stared restaurant and watched a high-end steak being slathered with butter again and again and again during the saute, before it hit the oven. And then some more butter. Then serve.<br/><br/>I'd never seen anything like this before. The chef explained that home cooks cut out the fat and then wonder why their food doesn't taste like it does at the restaurant!"},{"@type":"Review","author":{"@type":"Person","name":"Rosie Tunes"},"datePublished":"2016-01-25T16:42:12Z","reviewBody":"Homemade Buttermilk Ranch Dressing<br/>1 cup buttermilk<br/>1/2 cup mayonnaise<br/>1 teaspoon lemon juice<br/>1/8 teaspoon paprika<br/>1/4 teaspoon mustard powder<br/>1/2 teaspoon salt<br/>1/8 teaspoon black pepper<br/>1 Tbsp chopped fresh parsley<br/>1 teaspoon chopped fresh chives<br/>1/4 teaspoon of dry dill (or a teaspoon chopped fresh)<br/>-<br/>1 In a medium bowl, stir together the buttermilk and mayonnaise until fully mixed. Add in the other ingredients, adjusting for taste.<br/>About 1 1/2 cups. Keeps for a week, covered in the fridge."},{"@type":"Review","author":{"@type":"Person","name":"Sam Sifton"},"datePublished":"2016-01-26T14:14:09Z","reviewBody":"I cut the butter in half from the original recipe. You could go with even less. But I wouldn't forgo entirely. You want some fat to combine with the crust to make a kind of \"gravy.\""},{"@type":"Review","author":{"@type":"Person","name":"Richard Gillin"},"datePublished":"2016-01-26T06:03:08Z","reviewBody":"Sorry? Leftover beers? I don't understand!"},{"@type":"Review","author":{"@type":"Person","name":"barbinkent"},"datePublished":"2016-01-25T16:18:08Z","reviewBody":"Whoa, I make this recipe a lot. Here's another take on it.<br/>Braise meat. Use either dutch oven low, the slow cooker or a pressure cooker. <br/><br/>Slice large onion. Set it in. Add roast. Add dill, garlic, a little paprika...and the pepperoncini - I cut the tops off and occasionally take out seeds. Or, buy pepperoncini rings. I used to drain it, but seriously, no.<br/>ADD TWO LEFTOVER BEERS. Enough to cover meat! Add two bouillon cubes; cook til it falls apart. Chicago Style Italian Beef. Voila."},{"@type":"Review","author":{"@type":"Person","name":"Diane"},"datePublished":"2016-01-27T11:37:10Z","reviewBody":"Cooked this yesterday in a 300 degree oven for 3.5 hours in my le creuset dutch oven and it came out FABULOUS"},{"@type":"Review","author":{"@type":"Person","name":"Michelle"},"datePublished":"2016-01-25T15:55:09Z","reviewBody":"In another article on his interpretation, Sifton said, \"I seared the roast before placing it in the slow cooker, browning it aggressively beneath a shower of salt and pepper and a coating of all-purpose flour that I hoped would create a fond, or base of flavor, to replace the gravy mix, and give some structure to the sauce.\""},{"@type":"Review","author":{"@type":"Person","name":"John L."},"datePublished":"2016-01-25T11:30:11Z","reviewBody":"Would love to see Dutch Oven alternative instructions."}],"totalTime":"PT8H","url":"//cooking.nytimes.com/recipes/1017937-mississippi-roast"}</script>
</head><body></body></html>
