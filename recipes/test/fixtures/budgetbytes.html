www.budgetbytes.com\/author\/beth\/"},{"@type":"Recipe","name":"One Pot Creamy Cajun Chicken Pasta","author":{"@id":"https:\/\/www.budgetbytes.com\/#\/schema\/person\/de533a4dad507aefcf8ea04e131701f9"},"description":"Cook a complete dinner in one pot with this Creamy Cajun Chicken Pasta, using mostly pantry-stable items. Perfect for busy weeknights!&nbsp;","datePublished":"2018-10-21T22:07:41+00:00","image":["https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2018\/10\/One-Pot-Creamy-Cajun-Chicken-Pasta-pan.jpg","https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2018\/10\/One-Pot-Creamy-Cajun-Chicken-Pasta-pan-500x500.jpg","https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2018\/10\/One-Pot-Creamy-Cajun-Chicken-Pasta-pan-500x375.jpg","https:\/\/www.budgetbytes.com\/wp-content\/uploads\/2018\/10\/One-Pot-Creamy-Cajun-Chicken-Pasta-pan-480x270.jpg"],"video":{"name":"One Pot Creamy Cajun Chicken Pasta","description":"Spicy, creamy, and filling, all with only one pot to wash! Total win. You'll want this one in your weekly rotation. FULL RECIPE BELOW.\n\nPRINTABLE RECIPE:\n\nFull Recipe 👇👇👇\n\nINGREDIENTS\n\nCAJUN SEASONING\n2 tsp smoked paprika\n1 tsp oregano\n1 tsp thyme\n1\/2 tsp garlic powder\n1\/2 tsp onion powder\n1\/4 tsp cayenne pepper\n1\/4 tsp black pepper\n1\/4 tsp salt\n\nCHICKEN PASTA\n1 Tbsp olive oil\n1 Tbsp butter\n1 lb. boneless, skinless chicken breast\n1 yellow onion, diced\n1\/2 lb. penne pasta\n15 oz. fire roasted diced tomatoes\n2 cups chicken broth\n2 oz. cream cheese\n3 green onions, sliced\n\nINSTRUCTIONS\n1. Combine the ingredients for the Cajun seasoning in a small bowl. Cut the chicken into 1\/2 to 3\/4-inch cubes. Place the cubed chicken in a bowl, pour the Cajun seasoning over top, and stir to coat the chicken in spices.\n2. Add the olive oil and butter to a large deep skillet. Heat the oil and butter over medium-high until the skillet is very hot and the butter is melted and foamy. Add the seasoned chicken to the skillet and cook for a couple minutes on each side, or just until the outside gets some color. The chicken does not need to be cooked through at this point.\n3. Add the diced yellow onion to the skillet and continue to sauté for about 2 minutes more, or just until the onion begins to soften. Allow the moisture from the onion to dissolve any browned bits from the bottom of the skillet.\n4. Next, add the pasta, fire roasted diced tomatoes (with the juices), and chicken broth to the skillet. 5. Stir just until everything is evenly combined, then place a lid on top and allow the broth to come up to a boil.\n6. Once boiling, turn the heat down to medium-low and let the pasta simmer for about ten minutes, stirring every couple of minutes, until the pasta is tender and the liquid is thick and saucy.\n7. Add the cream cheese to the skillet in chunks, then stir until it has melted into the sauce. Top the pasta with sliced green onions and serve.\n\nInstagram: budgetbytes\nFacebook: budgetbytes1\nPinterest: budgetbytes\nTwitter: budget_bytes","uploadDate":"2018-12-30T00:42:54+00:00","creator":{"@type":"Organization","name":"Budget Bytes","url":"https:\/\/www.youtube.com\/channel\/UC17vdVOZBVxTSDcldUBBlRg"},"duration":"PT1M1S","interactionStatistic":[{"@type":"InteractionCounter","interactionType":{"@type":"WatchAction"},"userInteractionCount":204836},{"@type":"InteractionCounter","interactionType":{"@type":"LikeAction"},"userInteractionCount":1908},{"@type":"InteractionCounter","interactionType":{"@type":"CommentAction"},"userInteractionCount":49}],"thumbnailUrl":"https:\/\/i.ytimg.com\/vi\/qV0F5FiXUXw\/hqdefault.jpg","embedUrl":"https:\/\/www.youtube.com\/embed\/qV0F5FiXUXw?feature=oembed","contentUrl":"https:\/\/www.youtube.com\/watch?v=qV0F5FiXUXw","@type":"VideoObject"},"recipeYield":["4"],"prepTime":"PT10M","cookTime":"PT20M","totalTime":"PT30M","recipeIngredient":["2 tsp smoked paprika ($0.20)","1 tsp oregano ($0.10)","1 tsp thyme ($0.10)","1\/2 tsp garlic powder ($0.05)","1\/2 tsp onion pow teRating":{"@type":"AggregateRating","ratingValue":"4.65","ratingCount":"500","reviewCount":"17"},"review":[{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"I really liked this recipe! I plan on making it again and maybe adding some sausage as well. I found it needed extra seasoning and added some slap ya mama which made it perfect in my opinion. My family was good with the seasonings as is though!","author":{"@type":"Person","name":"Jane Smith"},"datePublished":"2026-10-01"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"1"},"reviewBody":"WAIT ME TOO","author":{"@type":"Person","name":"Haley"},"datePublished":"2026-08-30"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Made this tonight for dinner and it was delicious. This will be on repeat in our household. Thank you for sharing!","author":{"@type":"Person","name":"Terry Fredrick"},"datePublished":"2026-08-28"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"1"},"reviewBody":"The sauce was not thick, basically just made soup even though I followed the recipe exactly as it said :\/","author":{"@type":"Person","name":"Val"},"datePublished":"2026-08-17"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"So easy... and tasty. I upped the salt and pepper to 1\/2 tsp and went with the full fat and salt chicken broth. Tons of flavor. \r\n\r\nMight try swapping the chicken out and trying again with some mushrooms and lentils just to try for a vegetarian version.","author":{"@type":"Person","name":"Mmmm"},"datePublished":"2026-08-16"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Idk what you people are on about I think you have old spices. The mix is great","author":{"@type":"Person","name":"Uhm"},"datePublished":"2026-07-20"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Was super good, added some andouille sausage as well and traded penne for cavatappi as my family likes that shape and we had it on hand. Will be making again!","author":{"@type":"Person","name":"Mia"},"datePublished":"2026-07-06"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"ADD LEMON JUICE!! I agreed with the comments saying it was a bit bland. I added more salt, and the thing that made the biggest difference for me was adding a bit of lemon juice to it. So good, will definitely make this again","author":{"@type":"Person","name":"Becca"},"datePublished":"2026-06-21"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"3"},"reviewBody":"This was very easy to make and the directions were clear. It felt like it was missing something, though - it seemed a bit bland. Since the only salt was in the spice mix for the chicken, it definitely needed more salt at the table. We would probably make it again but use a premade cajun seasoning mix.","author":{"@type":"Person","name":"Dana"},"datePublished":"2026-06-14"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Made this last night and added spicy Italian sausage and it was just the right heat.  I followed the rest of the instructions and thus dish was a hit and something a little different to the weekly menu.  YUMMY YUMMY!!!","author":{"@type":"Person","name":"Veidra"},"datePublished":"2026-06-11"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"4"},"reviewBody":"Good recipe! For me personally it isn’t flavorful enough so I add more salt and Cajun seasoning in the end. Other than that it’s a great quick and easy recipe!","author":{"@type":"Person","name":"Denise"},"datePublished":"2026-06-08"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Delicious! Our need a pinch more salt than suggested, but otherwise this was great!","author":{"@type":"Person","name":"Jeana Smith"},"datePublished":"2026-06-03"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"I blend the fire roasted tomatoes before adding them to the pot, actually! Works out great!","author":{"@type":"Person","name":"Lindsey"},"datePublished":"2026-05-23"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Made this with dairy free cream cheese, and added spinach! Suuuuper yummy!","author":{"@type":"Person","name":"Jessie"},"datePublished":"2026-05-16"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Reminded me of a dish I used to make at a restaurant I worked at. Added bell peppers and spinach for more color this time. Tip: toss the chicken with oil when your seasoning. It helps prevent sticking and helps the spice coat more evenly. Fantastic recipe!","author":{"@type":"Person","name":"Cody"},"datePublished":"2026-05-14"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"This is a newer fave for our family! It is SO tasty!\r\n\r\nWe use ground turkey instead of chicken so there's no chopping or switching meats out of the pan. We also add zucchini and bell peppers to give it some vegetables. Everything cooks right in the pot with all that yummy cajun seasoning.","author":{"@type":"Person","name":"Megan"},"datePublished":"2026-04-30"},{"@type":"Review","reviewRating":{"@type":"Rating","ratingValue":"5"},"reviewBody":"Absolutely love this recipe -- it's kid-friendly if you keep the spice mild (like less than half of what's called for) and has become part of our regular rotation. I was wondering if anyone has tested freezing it for later use? Thanks!","author":{"@type":"Person","name":"Chloe"},"datePublished":"2026-04-23"}],"recipeCategory":["Dinner","Main Course"],"recipeCuisine":["American"],"keywords":"Dinner, One Pot, Quick, Spicy","nutrition":{"@type":"NutritionInformation","servingSize":"1 Serving","calories":"482.65 kcal","carbohydrateContent":"51.53 g","proteinContent":"34.95 g"
